name: Release

# Releasing is driven by labels on pull requests: merging a PR labeled
# `release:patch` or `release:minor` cuts and publishes the corresponding
# release. The version bump is therefore decided at review time, by the same
# person who judges whether the change is breaking.
on:
  pull_request:
    types: [closed]

# Serialize releases so two release-labeled PRs merging close together cannot
# race on tag creation.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
       contains(github.event.pull_request.labels.*.name, 'release:minor'))
    runs-on: ubuntu-latest

    permissions:
      # axion-release pushes the new tag to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          # Check out the branch the PR merged into (`main`), not the detached
          # merge ref `pull_request` would default to. axion's release tasks are
          # gated on the branch (releaseOnlyOnReleaseBranches), and it needs the
          # full history and tags to derive the version.
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v5.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Resolve version bump from label
        id: scope
        run: |
          if ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}; then
            echo "incrementer=incrementMinor" >> "$GITHUB_OUTPUT"
          else
            echo "incrementer=incrementPatch" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Must be a separate Gradle invocation from `publish`: axion computes the
      # version at configuration time, so the tag has to exist before the
      # publish build configures, otherwise it would publish a `-SNAPSHOT`.
      - name: Create and push release tag
        run: ./gradlew release -Prelease.versionIncrementer=${{ steps.scope.outputs.incrementer }}

      - name: Publish
        env:
          CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
          CLOUDSMITH_PASSWORD: ${{ secrets.CLOUDSMITH_PASSWORD }}
        run: ./gradlew publish
