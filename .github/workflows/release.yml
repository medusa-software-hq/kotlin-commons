name: Release

# Releasing is driven by labels on pull requests: merging a PR labeled
# `release:patch` or `release:minor` cuts and publishes the corresponding
# release. The version bump is therefore decided at review time, by the same
# person who judges whether the change is breaking.
#
# `workflow_dispatch` is a manual escape hatch to release `main` on demand,
# choosing the bump explicitly.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor]
        default: patch

# Serialize releases so two release-labeled PRs merging close together cannot
# race on tag creation.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor')))
    runs-on: ubuntu-latest

    permissions:
      # axion-release pushes the new tag to the repository.
      contents: write

    env:
      # On `pull_request` events axion-release determines the current branch from
      # the GITHUB_HEAD_REF environment variable, which holds the PR's *source*
      # branch — not the checked-out ref. Left alone, axion would see a non-release
      # branch, skip `release` (releaseOnlyOnReleaseBranches), and stamp the
      # version with that branch name. Override it to the base branch (`main`) so
      # axion recognizes a release branch and produces a clean version.
      GITHUB_HEAD_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          # Tag the merge commit on the base branch (`main`). Full history and
          # tags are required for axion to derive the version.
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v5.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.2.0

      # The bump comes from the `workflow_dispatch` input when dispatched, or from
      # the PR's `release:*` label when triggered by a merge.
      - name: Resolve version bump
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bump="${{ inputs.bump }}"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}; then
            bump="minor"
          else
            bump="patch"
          fi
          case "$bump" in
            minor) echo "incrementer=incrementMinor" >> "$GITHUB_OUTPUT" ;;
            *)     echo "incrementer=incrementPatch" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Must be a separate Gradle invocation from `publish`: axion computes the
      # version at configuration time, so the tag has to exist before the
      # publish build configures, otherwise it would publish a `-SNAPSHOT`.
      - name: Create and push release tag
        run: ./gradlew release -Prelease.versionIncrementer=${{ steps.scope.outputs.incrementer }}

      - name: Publish
        env:
          CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
          CLOUDSMITH_PASSWORD: ${{ secrets.CLOUDSMITH_PASSWORD }}
        run: ./gradlew publish
