name: Integration tests

# Integration tests hit the live OpenAI API and cost real money, so they run on
# manual dispatch only — never on pull requests or merges. The credential is a
# dedicated, budget-capped key stored as OPENAI_API_KEY_INTEGRATION_TESTS and
# exposed to the test JVM under the OPENAI_API_KEY name the tests read.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: 21

jobs:
  openai-client:
    name: openai-client integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-java@v5.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_INTEGRATION_TESTS }}
        run: ./gradlew :libraries:openai-client:integrationTest
